<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @keyframes rotatex {
        from {
          transform: rotateX(0deg);
        }
        to {
          transform: rotateX(180deg);
        }
      }
      @keyframes rotatey {
        from {
          transform: rotateY(0deg);
        }
        to {
          transform: rotateY(180deg);
        }
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(128, 145, 160);
      }
      .parent {
        height: 300px;
        width: 250px;
        perspective: 1000px;
        margin: 10px;
      }
      .card,
      .card1,
      .card2,
      .card3 {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: all 1s ease-in;
      }
      .front,
      .back,
      .front1,
      .back1,
      .front2,
      .back2,
      .front3,
      .back3 {
        height: 100%;
        width: 100%;
        height: 100%;
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 900;
        font-size: 30px;
        text-transform: capitalize;
        backface-visibility: hidden;
      }
      .front {
        background-color: aqua;
      }
      .back {
        background-color: rgb(12, 148, 96);
        transform: rotateY(180deg);
      }
      .parent:hover .card {
        transform: rotateY(180deg);
      }
      .front1 {
        background-color: brown;
      }
      .back1 {
        background-color: aquamarine;
        transform: rotateX(180deg);
      }
      .parent:hover .card1 {
        transform: rotateX(180deg);
      }
      .front2 {
        background-color: chocolate;
      }
      .back2 {
        background-color: rgb(177, 112, 65);
        transform: rotateX(180deg);
      }
      .card2 {
        animation: rotatex 2s ease-in-out 1s infinite;
        transform-style: preserve-3d;
      }
      .front3 {
        background-color: chocolate;
      }
      .back3 {
        background-color: rgb(177, 112, 65);
        transform: rotateX(180deg);
      }
      .card3 {
        animation: rotatey 2s ease-in-out 1s infinite;
        transform-style: preserve-3d;
      }

    </style>
  </head>
  <body>
    <div class="parent">
      <div class="card">
        <div class="front">Front</div>
        <div class="back">Back</div>
      </div>
    </div>
    <div class="parent">
      <div class="card1">
        <div class="front1">Front</div>
        <div class="back1">Back</div>
      </div>
    </div>
    <div class="parent">
      <div class="card2">
        <div class="front2">Front</div>
        <div class="back2">Back</div>
      </div>
    </div>
    <div class="parent">
      <div class="card3">
        <div class="front3">Front</div>
        <div class="back3">Back</div>
      </div>
    </div>
  </body>
</html>
