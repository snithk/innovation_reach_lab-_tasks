<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .cointainer {
        width: 50%;
        height: 70%;
        background-color: rgb(203, 12, 12);
        color: antiquewhite;
        border: 5px solid blue;
      }
      
      @media (max-width: 600px) and (max-height: 600px) {
        .cointainer {
          color: blueviolet;
          font-size: 25px;
          background-color: chartreuse;
        }
      }
      @media (max-height: 300) {
        .cointainer {
          background-color:crimson;
          text-align: center;
        }
      }

      @media (min-width: 600px) and (max-width: 800px) {
        .cointainer {
          background-color: blue;
          color: black;
          font-size: 25px;
        }
      }
      @media (min-width: 800px) or (min-height: 700px) {
        .cointainer {
          background-color: brown;
          color: aqua;
          border: 2px solid red;
        }
      }
    </style>
  </head>
  <body>
    <div class="cointainer">
      <div class="content">
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Facilis minima
        ipsam aut a, officiis vero repellendus quaerat perferendis esse
        architecto minus, vel consequatur nostrum. Nihil est fugit molestiae
        earum consequuntur.
      </div>
    </div>
  </body>
</html>
