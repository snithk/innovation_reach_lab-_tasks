<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .circle {
        height: 60vh;
        width: 60vh;
        border: 5px solid blue;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        background-color: aqua;
      }
      .circle1 {
        height: 50vh;
        width: 50vh;
        border: 5px solid rgb(12, 166, 35);
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        background-color: blueviolet;
      }
      .circle2 {
        height: 40vh;
        width: 40vh;
        border: 5px solid rgb(210, 55, 13);
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        background-color: yellowgreen;
      }
      .circle3 {
        height: 30vh;
        width: 30vh;
        border: 5px solid rgb(210, 13, 118);
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        background-color: white;
      }
      b{
        font-size: 30px;
        text-align: center;
        text-transform: capitalize;
        text-shadow: 5px 5px 5px blue;

      }
    </style>
  </head>
  <body>
    <div class="circle">
      <div class="circle1">
        <div class="circle2">
          <div class="circle3"> <b>Full stack developemt</b></div>
        </div>
      </div>
    </div>
  </body>
</html>
