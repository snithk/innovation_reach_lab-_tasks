<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        font-size: 20px;
        text-align: center;
        position: absolute;
      }
      #div1 {
        height: 200px;
        width: 200px;
        background-color: aqua;
        border: 2px solid black;
        z-index: -2;
      }
      #div2 {
        height: 150px;
        width: 150px;
        background-color: rgb(63, 18, 142);
        border: 2px solid black;
        z-index: -1;
      }
      #div3 {
        height: 300px;
        width: 300px;
        background-color: rgb(251, 11, 215);
        border: 2px solid black;
        z-index: -3;
      }
    </style>
  </head>

  <body>
    <div class="box" id="div1">hero1</div>
    <div class="box" id="div2">hero2</div>
    <div class="box" id="div3">hero3</div>
  </body>
</html>
