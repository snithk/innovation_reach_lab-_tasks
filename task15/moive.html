<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body{
            background-color: aliceblue;
           
        }
      .div1 {
        margin-top: 100px;
        margin-left: 500px;
        height: 400px;
        width: 300px;
        border: 5px solid black;
        box-sizing: border-box;
        border-radius: 20px;
      }
      .img1{
        height: 70%;
        width: 97%;
        padding: 5px;
        border-radius: 20px;
      }
      h1{
        line-height: 0;
        font-size: 25px;
        text-align: center;
      }
      p{
        text-align: center;
        font-size: 20px;
        line-height: 0%;
        padding-top: 10px;
      }
      .div1:hover{
        box-shadow: 10px 10px 10px 5px red,30px 20px 10px 10px black;
         height: 500px;
        width: 400px;
       
      }
    </style>
  </head>
  <body>
    <div class="div1">
      <img class="img1" src="hit3.jpg" alt="" />
      <h1>Movie: Interstellar</h1>
      <p><b>Genre:</b> Scifi</p>
      <p><b>Rating:</b>8.7/10</p>
    </div>
  </body>
</html>
